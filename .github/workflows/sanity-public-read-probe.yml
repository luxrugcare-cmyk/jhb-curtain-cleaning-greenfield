name: Sanity Public Read Probe

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".sanity-public-read-probe-trigger"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe anonymous published-content read
        shell: bash
        run: |
          set -euo pipefail
          url='https://g5y9wcb1.api.sanity.io/v2026-08-13/data/query/production'
          code=$(curl --silent --show-error --output /tmp/sanity-public.json --write-out '%{http_code}' \
            --get \
            --data-urlencode 'query=count(*[_type == "caseStudy"])' \
            "$url" || true)
          echo "Sanity anonymous read HTTP status: $code"
          if [ "$code" != "200" ]; then
            jq -c 'del(.result,.ms,.query)' /tmp/sanity-public.json 2>/dev/null || cat /tmp/sanity-public.json
            exit 1
          fi
          count=$(jq -r '.result' /tmp/sanity-public.json)
          echo "Sanity anonymous published-content read: PASS (HTTP 200; caseStudy count=$count)"
