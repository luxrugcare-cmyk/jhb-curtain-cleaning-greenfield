name: Sync Vercel Integration Secrets

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".vercel-secret-sync-trigger"

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      RESEND_WEBHOOK_SECRET: ${{ secrets.RESEND_WEBHOOK_SECRET }}
      ATTIO_API_KEY: ${{ secrets.ATTIO_API_KEY }}
      SANITY_API_READ_TOKEN: ${{ secrets.SANITY_API_READ_TOKEN }}
      BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
      N8N_LEAD_WEBHOOK_URL: ${{ secrets.N8N_LEAD_WEBHOOK_URL }}
      N8N_WEBHOOK_SECRET: ${{ secrets.N8N_WEBHOOK_SECRET }}
    steps:
      - name: Require Vercel token
        shell: bash
        run: test -n "$VERCEL_TOKEN"

      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Link Vercel project
        run: >-
          npx --yes vercel@latest link --yes
          --scope bookish-eureka
          --project jhb-curtain-cleaning-greenfield
          --token "$VERCEL_TOKEN"

      - name: Sync configured integration secrets
        shell: bash
        run: |
          set -euo pipefail
          sync_secret() {
            local name="$1"
            local value="${!name:-}"
            if [ -z "$value" ]; then
              echo "SKIP ${name}: GitHub secret missing"
              return 0
            fi
            npx --yes vercel@latest env rm "$name" production --yes --scope bookish-eureka --token "$VERCEL_TOKEN" >/dev/null 2>&1 || true
            printf '%s' "$value" | npx --yes vercel@latest env add "$name" production --scope bookish-eureka --token "$VERCEL_TOKEN" >/dev/null
            echo "SYNC ${name}: configured"
          }

          for name in \
            RESEND_API_KEY \
            RESEND_WEBHOOK_SECRET \
            ATTIO_API_KEY \
            SANITY_API_READ_TOKEN \
            BLOB_READ_WRITE_TOKEN \
            N8N_LEAD_WEBHOOK_URL \
            N8N_WEBHOOK_SECRET; do
            sync_secret "$name"
          done

      - name: Verify names only
        shell: bash
        run: |
          set -euo pipefail
          npx --yes vercel@latest pull --yes --environment=production --scope bookish-eureka --token "$VERCEL_TOKEN" >/dev/null
          for name in RESEND_API_KEY RESEND_WEBHOOK_SECRET ATTIO_API_KEY SANITY_API_READ_TOKEN BLOB_READ_WRITE_TOKEN N8N_LEAD_WEBHOOK_URL N8N_WEBHOOK_SECRET; do
            if grep -Eq "^${name}=.+" .vercel/.env.production.local; then
              echo "${name}: configured"
            else
              echo "${name}: missing"
            fi
          done
