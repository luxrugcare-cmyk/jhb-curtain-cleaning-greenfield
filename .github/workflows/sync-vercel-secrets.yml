name: Sync Vercel Integration Secrets

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".vercel-secret-sync-trigger"

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      RESEND_WEBHOOK_SECRET: ${{ secrets.RESEND_WEBHOOK_SECRET }}
      ATTIO_API_KEY: ${{ secrets.ATTIO_API_KEY }}
      BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
      N8N_LEAD_WEBHOOK_URL: ${{ secrets.N8N_LEAD_WEBHOOK_URL }}
      N8N_WEBHOOK_SECRET: ${{ secrets.N8N_WEBHOOK_SECRET }}
      NEXT_PUBLIC_SITE_URL: https://www.jhbcurtaincleaning.co.za
      NEXT_PUBLIC_BUSINESS_PHONE: "+27750119200"
      NEXT_PUBLIC_SANITY_PROJECT_ID: g5y9wcb1
      NEXT_PUBLIC_SANITY_DATASET: production
      NEXT_PUBLIC_SANITY_API_VERSION: 2026-08-13
      NEXT_PUBLIC_GA_MEASUREMENT_ID: G-E4ZJQ57W4Y
      ENABLE_FAILURE_ARCHIVE: "true"
    steps:
      - name: Require Vercel token
        shell: bash
        run: test -n "$VERCEL_TOKEN"

      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Link Vercel project
        run: >-
          npx --yes vercel@latest link --yes
          --scope bookish-eureka
          --project jhb-curtain-cleaning-greenfield
          --token "$VERCEL_TOKEN"

      - name: Sync configured integration secrets
        shell: bash
        run: |
          set -euo pipefail
          sync_secret() {
            local name="$1"
            local value="${!name:-}"
            if [ -z "$value" ]; then
              echo "SKIP ${name}: GitHub secret missing"
              return 0
            fi
            npx --yes vercel@latest env rm "$name" production --yes --scope bookish-eureka --token "$VERCEL_TOKEN" >/dev/null 2>&1 || true
            printf '%s' "$value" | npx --yes vercel@latest env add "$name" production --scope bookish-eureka --token "$VERCEL_TOKEN" >/dev/null
            echo "SYNC ${name}: configured"
          }

          for name in \
            RESEND_API_KEY \
            RESEND_WEBHOOK_SECRET \
            ATTIO_API_KEY \
            BLOB_READ_WRITE_TOKEN \
            N8N_LEAD_WEBHOOK_URL \
            N8N_WEBHOOK_SECRET; do
            sync_secret "$name"
          done

      - name: Sync readable production configuration
        shell: bash
        run: |
          set -euo pipefail
          sync_config() {
            local name="$1"
            local value="${!name}"
            npx --yes vercel@latest env rm "$name" production --yes --scope bookish-eureka --token "$VERCEL_TOKEN" >/dev/null 2>&1 || true
            printf '%s' "$value" | npx --yes vercel@latest env add "$name" production --no-sensitive --scope bookish-eureka --token "$VERCEL_TOKEN" >/dev/null
            echo "SYNC ${name}: configured"
          }

          for name in \
            NEXT_PUBLIC_SITE_URL \
            NEXT_PUBLIC_BUSINESS_PHONE \
            NEXT_PUBLIC_SANITY_PROJECT_ID \
            NEXT_PUBLIC_SANITY_DATASET \
            NEXT_PUBLIC_SANITY_API_VERSION \
            NEXT_PUBLIC_GA_MEASUREMENT_ID \
            ENABLE_FAILURE_ARCHIVE; do
            sync_config "$name"
          done

      - name: Verify production configuration
        shell: bash
        run: |
          set -euo pipefail
          npx --yes vercel@latest pull --yes --environment=production --scope bookish-eureka --token "$VERCEL_TOKEN" >/dev/null
          for name in \
            RESEND_API_KEY \
            RESEND_WEBHOOK_SECRET \
            ATTIO_API_KEY \
            SANITY_API_READ_TOKEN \
            BLOB_READ_WRITE_TOKEN \
            N8N_LEAD_WEBHOOK_URL \
            N8N_WEBHOOK_SECRET \
            NEXT_PUBLIC_SITE_URL \
            NEXT_PUBLIC_BUSINESS_PHONE \
            NEXT_PUBLIC_SANITY_PROJECT_ID \
            NEXT_PUBLIC_SANITY_DATASET \
            NEXT_PUBLIC_SANITY_API_VERSION \
            NEXT_PUBLIC_GA_MEASUREMENT_ID \
            ENABLE_FAILURE_ARCHIVE; do
            if grep -Eq "^${name}=.+" .vercel/.env.production.local; then
              echo "${name}: configured"
            else
              echo "${name}: missing"
            fi
          done

          set -a
          source .vercel/.env.production.local
          set +a
          test "${NEXT_PUBLIC_SITE_URL:-}" = "https://www.jhbcurtaincleaning.co.za"
          test "${NEXT_PUBLIC_BUSINESS_PHONE:-}" = "+27750119200"
          test "${ENABLE_FAILURE_ARCHIVE:-}" = "true"
          echo "Readable public configuration value checks: passed"
