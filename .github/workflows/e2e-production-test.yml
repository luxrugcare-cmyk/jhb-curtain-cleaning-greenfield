name: Controlled Production E2E

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/e2e-production-test.yml"

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      BASE_URL: https://jhb-curtain-cleaning-greenfield.vercel.app
      REQUEST_ID: e2e-20260813-1759-residential
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Confirm production Blob configuration
        shell: bash
        run: |
          set -euo pipefail
          test -n "$VERCEL_TOKEN"
          npx --yes vercel@latest link --yes --scope bookish-eureka --project jhb-curtain-cleaning-greenfield --token "$VERCEL_TOKEN" >/dev/null
          npx --yes vercel@latest pull --yes --environment=production --scope bookish-eureka --token "$VERCEL_TOKEN" >/dev/null
          grep -Eq '^BLOB_READ_WRITE_TOKEN=.+' .vercel/.env.production.local
          echo "PASS production Blob token is configured"

      - name: Verify private Blob through production upload API
        shell: bash
        run: |
          set -euo pipefail
          BASE_URL="$BASE_URL" REQUEST_ID="$REQUEST_ID" node --input-type=module <<'NODE'
          import { upload } from '@vercel/blob/client';

          const baseUrl = process.env.BASE_URL;
          const requestId = process.env.REQUEST_ID;
          const bytes = new Uint8Array([137,80,78,71,13,10,26,10,0,0,0,0]);
          const file = new File([bytes], 'e2e-test.png', { type: 'image/png' });
          const blob = await upload(`lead-photos/${requestId}/e2e-test.png`, file, {
            access: 'private',
            handleUploadUrl: `${baseUrl}/api/uploads`,
            clientPayload: JSON.stringify({ requestId }),
          });
          if (!blob.pathname?.startsWith(`lead-photos/${requestId}/`)) {
            throw new Error(`Unexpected uploaded pathname: ${blob.pathname}`);
          }

          const response = await fetch(`${baseUrl}/api/uploads`, {
            method: 'DELETE',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ requestId, pathname: blob.pathname }),
          });
          if (!response.ok) {
            throw new Error(`Blob cleanup failed (${response.status}): ${await response.text()}`);
          }
          console.log('PASS production private Blob upload and delete');
          NODE

      - name: Verify upload API rejects malformed request
        shell: bash
        run: |
          set -euo pipefail
          code=$(curl --silent --show-error --output /tmp/upload.json --write-out "%{http_code}" \
            -X POST -H "Content-Type: application/json" -d '{}' "$BASE_URL/api/uploads")
          if [ "$code" = "503" ]; then
            echo "FAIL upload API still reports storage not configured"
            cat /tmp/upload.json
            exit 1
          fi
          if [ "$code" != "400" ]; then
            echo "FAIL expected malformed upload request to return 400, got $code"
            cat /tmp/upload.json
            exit 1
          fi
          echo "PASS /api/uploads is storage-enabled and rejects malformed requests (400)"

      - name: Submit controlled residential lead
        shell: bash
        run: |
          set -euo pipefail
          cat >/tmp/lead.json <<JSON
          {
            "requestId": "$REQUEST_ID",
            "kind": "residential",
            "name": "JHB E2E Test Lead",
            "email": "delivered@resend.dev",
            "mobile": "+27 75 000 0001",
            "service": "Curtain Cleaning",
            "propertyType": "Residential test property",
            "location": "Johannesburg",
            "scope": "CONTROLLED E2E TEST - no customer action required",
            "preferredContact": "email",
            "marketingConsent": false,
            "sourcePath": "/quote",
            "sourceUrl": "$BASE_URL/quote",
            "utmSource": "e2e-test",
            "utmMedium": "system",
            "utmCampaign": "production-validation",
            "privacyNoticeVersion": "2026-08-v1",
            "photos": []
          }
          JSON
          code=$(curl --silent --show-error --output /tmp/lead-response.json --write-out "%{http_code}" \
            -X POST -H "Content-Type: application/json" --data-binary @/tmp/lead.json "$BASE_URL/api/leads")
          if [ "$code" != "201" ]; then
            echo "FAIL controlled lead expected 201, got $code"
            cat /tmp/lead-response.json
            exit 1
          fi
          jq -e '.ok == true' /tmp/lead-response.json >/dev/null
          jq -e '.crm.ok == true and (.crm.mode | startswith("live"))' /tmp/lead-response.json >/dev/null
          jq -e '.acknowledgement.ok == true and .acknowledgement.mode == "live"' /tmp/lead-response.json >/dev/null
          jq -e '.internalNotification.ok == true and .internalNotification.mode == "live"' /tmp/lead-response.json >/dev/null
          jq -e '(.warnings | length) == 0' /tmp/lead-response.json >/dev/null
          echo "PASS controlled lead accepted (201)"
          jq '{requestId, leadId, crmMode:.crm.mode, acknowledgementMode:.acknowledgement.mode, internalNotificationMode:.internalNotification.mode, warnings}' /tmp/lead-response.json
