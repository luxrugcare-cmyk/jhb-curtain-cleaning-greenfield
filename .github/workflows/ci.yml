name: Greenfield CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Report dependency security audit
        shell: bash
        run: |
          npm audit --json > /tmp/npm-audit.json || true
          cat /tmp/npm-audit.json

      - name: Trace vulnerable dependency chains
        shell: bash
        run: |
          npm ls js-yaml undici @vercel/frameworks @module-federation/dts-plugin @module-federation/enhanced --all || true
          node - <<'NODE'
          const packages = require('./package-lock.json').packages;
          const targets = Object.entries(packages).filter(([path]) =>
            path === 'node_modules/js-yaml' ||
            path.includes('@vercel/frameworks') ||
            path.includes('@module-federation/dts-plugin') ||
            path.includes('@module-federation/enhanced') ||
            path === 'node_modules/undici' ||
            path.endsWith('/node_modules/undici')
          );
          for (const [path, meta] of targets) {
            console.log(`\n### ${path || '<root>'}`);
            console.log(JSON.stringify({version: meta.version, dependencies: meta.dependencies, optionalDependencies: meta.optionalDependencies}, null, 2));
          }
          NODE

      - name: Test production audit with direct Sanity client runtime
        shell: bash
        run: |
          cp package.json /tmp/package.json.before
          cp package-lock.json /tmp/package-lock.json.before
          npm pkg delete dependencies.next-sanity
          npm pkg delete dependencies.sanity
          npm pkg set 'dependencies.@sanity/client=^7.26.2'
          npm pkg set 'devDependencies.sanity=^6.7.0'
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm audit --omit=dev --json > /tmp/npm-audit-production.json || true
          cat /tmp/npm-audit-production.json
          mv /tmp/package.json.before package.json
          mv /tmp/package-lock.json.before package-lock.json

      - name: Audit internal imports
        run: npm run audit:imports

      - name: Typecheck
        run: npm run typecheck

      - name: Production build
        run: npm run build

      - name: Smoke test built server
        shell: bash
        run: |
          npm start > /tmp/jhb-next.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true; cat /tmp/jhb-next.log' EXIT

          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3000/api/health >/tmp/health.json; then
              break
            fi
            sleep 1
          done

          cat /tmp/health.json
          grep -q '"ok":true' /tmp/health.json

          for path in \
            / \
            /quote \
            /commercial-assessment \
            /services/curtain-cleaning \
            /commercial/hotels-hospitality \
            /areas/johannesburg \
            /robots.txt \
            /sitemap.xml; do
            echo "Checking $path"
            curl --fail --silent --show-error "http://127.0.0.1:3000$path" >/dev/null
          done

          STATUS=$(curl --silent --output /tmp/invalid-lead.json --write-out '%{http_code}' \
            -X POST \
            -H 'Content-Type: application/json' \
            -d '{}' \
            http://127.0.0.1:3000/api/leads)
          test "$STATUS" = "400"
