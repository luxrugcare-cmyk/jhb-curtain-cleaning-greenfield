name: Greenfield CI

on:
  push:
    branches: [main, fix/precutover-seo-analytics-v2]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Regenerate and commit lockfile on validation branch
        if: github.ref == 'refs/heads/fix/precutover-seo-analytics-v2'
        shell: bash
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          if ! git diff --quiet -- package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "chore: regenerate package lock [skip ci]"
            git push origin HEAD:fix/precutover-seo-analytics-v2
          fi

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Report full dependency security audit
        shell: bash
        run: |
          npm audit --json > /tmp/npm-audit.json || true
          cat /tmp/npm-audit.json

      - name: Enforce production dependency security gate
        run: npm audit --omit=dev --audit-level=high

      - name: Audit internal imports
        run: npm run audit:imports

      - name: Typecheck
        run: npm run typecheck

      - name: Production build
        run: npm run build

      - name: Smoke test built server
        shell: bash
        run: |
          npm start > /tmp/jhb-next.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true; cat /tmp/jhb-next.log' EXIT

          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3000/api/health >/tmp/health.json; then
              break
            fi
            sleep 1
          done

          cat /tmp/health.json
          grep -q '"ok":true' /tmp/health.json

          for path in \
            / \
            /quote \
            /commercial-assessment \
            /services/curtain-cleaning \
            /commercial/hotels-hospitality \
            /areas/johannesburg \
            /robots.txt \
            /sitemap.xml; do
            echo "Checking $path"
            curl --fail --silent --show-error "http://127.0.0.1:3000$path" >/dev/null
          done

          STATUS=$(curl --silent --output /tmp/invalid-lead.json --write-out '%{http_code}' \
            -X POST \
            -H 'Content-Type: application/json' \
            -d '{}' \
            http://127.0.0.1:3000/api/leads)
          test "$STATUS" = "400"
