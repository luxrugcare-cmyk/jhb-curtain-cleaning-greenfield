name: Domain Cutover Preflight

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/domain-cutover-preflight.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      SCOPE: bookish-eureka
      PROJECT: jhb-curtain-cleaning-greenfield
      WWW_DOMAIN: www.jhbcurtaincleaning.co.za
      APEX_DOMAIN: jhbcurtaincleaning.co.za
      TARGET_DEPLOYMENT: jhb-curtain-cleaning-greenfield-e0vgggdvt-bookish-eureka.vercel.app
    steps:
      - name: Require Vercel token
        run: test -n "$VERCEL_TOKEN"

      - name: Inspect target deployment
        shell: bash
        run: |
          set -euo pipefail
          npx --yes vercel@latest inspect "$TARGET_DEPLOYMENT" --scope "$SCOPE" --token "$VERCEL_TOKEN"

      - name: Inspect Vercel domain and alias state
        shell: bash
        run: |
          set -uo pipefail
          echo "=== domains ls ==="
          npx --yes vercel@latest domains ls --limit 100 --scope "$SCOPE" --token "$VERCEL_TOKEN" || true
          echo "=== inspect www ==="
          npx --yes vercel@latest domains inspect "$WWW_DOMAIN" --scope "$SCOPE" --token "$VERCEL_TOKEN" || true
          echo "=== inspect apex ==="
          npx --yes vercel@latest domains inspect "$APEX_DOMAIN" --scope "$SCOPE" --token "$VERCEL_TOKEN" || true
          echo "=== aliases ls ==="
          npx --yes vercel@latest alias ls --limit 100 --scope "$SCOPE" --token "$VERCEL_TOKEN" || true

      - name: Inspect public DNS and HTTPS before cutover
        shell: bash
        run: |
          set -euo pipefail
          echo "=== DNS www ==="
          dig +short CNAME "$WWW_DOMAIN" || true
          dig +short A "$WWW_DOMAIN" || true
          echo "=== DNS apex ==="
          dig +short A "$APEX_DOMAIN" || true
          dig +short AAAA "$APEX_DOMAIN" || true
          echo "=== HTTPS www ==="
          curl --silent --show-error --location --max-time 20 --dump-header /tmp/www-headers.txt --output /tmp/www-body.html "https://$WWW_DOMAIN/" || true
          cat /tmp/www-headers.txt 2>/dev/null || true
          echo "=== body markers ==="
          grep -Eio '<title>[^<]*</title>|<link[^>]+rel=["'"']canonical["'"'][^>]*>|JHB Curtain Cleaning|Clean curtains\. Open rooms\. No removal\.' /tmp/www-body.html 2>/dev/null | head -20 || true
          echo "=== HTTPS apex ==="
          curl --silent --show-error --location --max-time 20 --dump-header /tmp/apex-headers.txt --output /tmp/apex-body.html "https://$APEX_DOMAIN/" || true
          cat /tmp/apex-headers.txt 2>/dev/null || true
