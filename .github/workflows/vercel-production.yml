name: Vercel Production Deploy

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".vercel-deploy-trigger"

permissions:
  contents: read

concurrency:
  group: vercel-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - name: Require Vercel token
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "VERCEL_TOKEN repository secret is required."
            exit 1
          fi

      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate source
        run: |
          npm run typecheck
          npm run build

      - name: Link validated source to existing Vercel project
        run: >-
          npx --yes vercel@latest link --yes
          --scope bookish-eureka
          --project jhb-curtain-cleaning-greenfield
          --token "$VERCEL_TOKEN"

      - name: Pull production configuration
        run: >-
          npx --yes vercel@latest pull --yes
          --environment=production
          --scope bookish-eureka
          --token "$VERCEL_TOKEN"

      - name: Build with Vercel
        run: >-
          npx --yes vercel@latest build --prod
          --scope bookish-eureka
          --token "$VERCEL_TOKEN"

      - name: Deploy prebuilt output to production
        id: deploy
        run: |
          URL=$(npx --yes vercel@latest deploy --prebuilt --prod --scope bookish-eureka --token "$VERCEL_TOKEN")
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "### Vercel production deployment" >> "$GITHUB_STEP_SUMMARY"
          echo "$URL" >> "$GITHUB_STEP_SUMMARY"

      - name: Verify health endpoint
        run: |
          curl --fail --silent --show-error --retry 5 --retry-delay 3 "${{ steps.deploy.outputs.url }}/api/health"
