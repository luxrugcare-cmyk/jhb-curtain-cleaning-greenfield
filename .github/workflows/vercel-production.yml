name: Vercel Production Deploy

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".vercel-deploy-trigger"
      - ".github/workflows/vercel-production.yml"
      - "app/**"
      - "components/**"
      - "integrations/**"
      - "lib/**"
      - "types/**"
      - "package.json"
      - "package-lock.json"

permissions:
  contents: read

concurrency:
  group: vercel-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - name: Require Vercel token
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "VERCEL_TOKEN repository secret is required."
            exit 1
          fi

      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Validate source
        run: |
          npm audit --omit=dev --audit-level=high
          npm run audit:imports
          npm run typecheck
          npm run build

      - name: Link validated source to existing Vercel project
        run: >-
          npx --yes vercel@latest link --yes
          --scope bookish-eureka
          --project jhb-curtain-cleaning-greenfield
          --token "$VERCEL_TOKEN"

      - name: Pull production configuration
        run: >-
          npx --yes vercel@latest pull --yes
          --environment=production
          --scope bookish-eureka
          --token "$VERCEL_TOKEN"

      - name: Enforce production integration readiness
        shell: bash
        run: |
          set -euo pipefail
          ENV_FILE=.vercel/.env.production.local
          echo "### Production integration readiness" >> "$GITHUB_STEP_SUMMARY"

          required=(
            NEXT_PUBLIC_SITE_URL
            NEXT_PUBLIC_BUSINESS_PHONE
            NEXT_PUBLIC_GA_MEASUREMENT_ID
            ATTIO_API_KEY
            RESEND_API_KEY
            RESEND_FROM_EMAIL
            LEAD_NOTIFICATION_EMAIL
            NEXT_PUBLIC_SANITY_PROJECT_ID
            NEXT_PUBLIC_SANITY_DATASET
            NEXT_PUBLIC_SANITY_API_VERSION
            SANITY_API_READ_TOKEN
            BLOB_READ_WRITE_TOKEN
            ENABLE_FAILURE_ARCHIVE
            RESEND_TEMPLATE_RESIDENTIAL_ACK
            RESEND_TEMPLATE_COMMERCIAL_ACK
            RESEND_TEMPLATE_INTERNAL_LEAD
            RESEND_WEBHOOK_SECRET
          )
          optional=(
            N8N_LEAD_WEBHOOK_URL
            N8N_WEBHOOK_SECRET
          )

          missing=0
          for name in "${required[@]}"; do
            if [ -f "$ENV_FILE" ] && grep -Eq "^${name}=.+" "$ENV_FILE"; then
              status="configured"
            else
              status="missing/empty"
              missing=1
            fi
            echo "${name}: ${status}"
            echo "- ${name}: ${status}" >> "$GITHUB_STEP_SUMMARY"
          done

          for name in "${optional[@]}"; do
            if [ -f "$ENV_FILE" ] && grep -Eq "^${name}=.+" "$ENV_FILE"; then
              status="configured"
            else
              status="optional/unconfigured"
            fi
            echo "${name}: ${status}"
            echo "- ${name}: ${status}" >> "$GITHUB_STEP_SUMMARY"
          done

          set -a
          source "$ENV_FILE"
          set +a
          if [ "${ENABLE_FAILURE_ARCHIVE:-}" != "true" ]; then
            echo "ENABLE_FAILURE_ARCHIVE must be true in Production."
            echo "- ENABLE_FAILURE_ARCHIVE value check: FAILED" >> "$GITHUB_STEP_SUMMARY"
            missing=1
          else
            echo "ENABLE_FAILURE_ARCHIVE value check: true"
            echo "- ENABLE_FAILURE_ARCHIVE value check: true" >> "$GITHUB_STEP_SUMMARY"
          fi

          if [ "$missing" -ne 0 ]; then
            echo "Required production integration configuration is incomplete."
            exit 1
          fi

      - name: Validate Sanity read access (non-blocking)
        shell: bash
        run: |
          set -u
          ENV_FILE=.vercel/.env.production.local
          set -a
          source "$ENV_FILE"
          set +a

          project="${NEXT_PUBLIC_SANITY_PROJECT_ID:-}"
          dataset="${NEXT_PUBLIC_SANITY_DATASET:-}"
          api_version="${NEXT_PUBLIC_SANITY_API_VERSION:-}"
          token="${SANITY_API_READ_TOKEN:-}"

          if [ -z "$project" ] || [ -z "$dataset" ] || [ -z "$api_version" ] || [ -z "$token" ]; then
            echo "- Sanity authenticated read check: SKIPPED (configuration incomplete)" >> "$GITHUB_STEP_SUMMARY"
            echo "::warning::Sanity authenticated read check skipped because required values are missing."
            exit 0
          fi

          endpoint="https://${project}.api.sanity.io/v${api_version}/data/query/${dataset}"
          response_file=/tmp/sanity-read-check.json
          http_code=$(curl --silent --show-error --output "$response_file" --write-out "%{http_code}" \
            --get \
            --header "Authorization: Bearer ${token}" \
            --data-urlencode 'query=count(*[_type == "caseStudy"])' \
            "$endpoint" || true)

          if [ "$http_code" = "200" ]; then
            echo "Sanity authenticated read check: PASS"
            echo "- Sanity authenticated read check: PASS (HTTP 200)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Sanity authenticated read check: WARN (HTTP ${http_code:-unavailable})"
            echo "- Sanity authenticated read check: WARN (HTTP ${http_code:-unavailable}); site remains fail-soft" >> "$GITHUB_STEP_SUMMARY"
            echo "::warning::Sanity read credentials are not currently authenticating (HTTP ${http_code:-unavailable}). Public pages remain protected by fail-soft CMS fallbacks."
          fi

      - name: Build with Vercel
        run: >-
          npx --yes vercel@latest build --prod
          --scope bookish-eureka
          --token "$VERCEL_TOKEN"

      - name: Deploy prebuilt output to production
        id: deploy
        run: |
          URL=$(npx --yes vercel@latest deploy --prebuilt --prod --scope bookish-eureka --token "$VERCEL_TOKEN")
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "### Vercel production deployment" >> "$GITHUB_STEP_SUMMARY"
          echo "$URL" >> "$GITHUB_STEP_SUMMARY"

      - name: Smoke test public production routes, canonicals and APIs
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://jhb-curtain-cleaning-greenfield.vercel.app"
          ENV_FILE=.vercel/.env.production.local
          set -a
          source "$ENV_FILE"
          set +a
          CANONICAL_BASE="${NEXT_PUBLIC_SITE_URL%/}"

          routes=(
            "/"
            "/quote"
            "/commercial-assessment"
            "/services"
            "/services/curtain-cleaning"
            "/commercial/hotels-hospitality"
            "/areas/johannesburg"
            "/privacy"
            "/robots.txt"
            "/sitemap.xml"
          )
          for route in "${routes[@]}"; do
            code=$(curl --location --silent --show-error --retry 5 --retry-delay 2 --output /dev/null --write-out "%{http_code}" "$BASE$route")
            if [ "$code" != "200" ]; then
              echo "Smoke test failed: $route returned HTTP $code"
              exit 1
            fi
            echo "PASS $route ($code)"
          done

          check_canonical() {
            route="$1"
            expected="$2"
            file="/tmp/canonical-$(echo "$route" | tr '/:' '__').html"
            curl --location --fail --silent --show-error --retry 5 --retry-delay 2 "$BASE$route" > "$file"
            python - "$file" "$expected" <<'PY'
          from html.parser import HTMLParser
          import sys

          class CanonicalParser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.hrefs = []
              def handle_starttag(self, tag, attrs):
                  if tag != "link":
                      return
                  values = dict(attrs)
                  rel = values.get("rel", "").split()
                  if "canonical" in rel and values.get("href"):
                      self.hrefs.append(values["href"])

          path, expected = sys.argv[1], sys.argv[2]
          parser = CanonicalParser()
          with open(path, encoding="utf-8") as handle:
              parser.feed(handle.read())
          if parser.hrefs != [expected]:
              raise SystemExit(f"canonical mismatch: expected {[expected]!r}, got {parser.hrefs!r}")
          print(f"PASS canonical {expected}")
          PY
          }

          check_canonical "/" "$CANONICAL_BASE"
          check_canonical "/quote" "$CANONICAL_BASE/quote"
          check_canonical "/commercial-assessment" "$CANONICAL_BASE/commercial-assessment"
          check_canonical "/services" "$CANONICAL_BASE/services"
          check_canonical "/services/curtain-cleaning" "$CANONICAL_BASE/services/curtain-cleaning"
          check_canonical "/commercial/hotels-hospitality" "$CANONICAL_BASE/commercial/hotels-hospitality"
          check_canonical "/areas/johannesburg" "$CANONICAL_BASE/areas/johannesburg"
          check_canonical "/privacy" "$CANONICAL_BASE/privacy"

          health=$(curl --location --fail --silent --show-error --retry 5 --retry-delay 2 "$BASE/api/health")
          echo "Health response: $health"
          echo "$health" | grep -q '"ok":true'
          echo "PASS /api/health JSON"

          lead_code=$(curl --location --silent --show-error --output /tmp/lead-body.json --write-out "%{http_code}" \
            -X POST -H "Content-Type: application/json" -d '{}' "$BASE/api/leads")
          if [ "$lead_code" != "400" ]; then
            echo "Invalid lead validation failed: expected HTTP 400, got $lead_code"
            cat /tmp/lead-body.json
            exit 1
          fi
          echo "PASS /api/leads invalid payload validation (400)"

          webhook_unsigned_code=$(curl --location --silent --show-error --output /tmp/resend-webhook-unsigned.json --write-out "%{http_code}" \
            -X POST -H "Content-Type: application/json" -d '{}' "$BASE/api/webhooks/resend")
          if [ "$webhook_unsigned_code" != "400" ]; then
            echo "Unsigned Resend webhook validation failed: expected HTTP 400, got $webhook_unsigned_code"
            cat /tmp/resend-webhook-unsigned.json
            exit 1
          fi
          echo "PASS /api/webhooks/resend unsigned request rejected (400)"

          webhook_bad_signature_code=$(curl --location --silent --show-error --output /tmp/resend-webhook-bad-signature.json --write-out "%{http_code}" \
            -X POST \
            -H "Content-Type: application/json" \
            -H "svix-id: smoke-test" \
            -H "svix-timestamp: $(date +%s)" \
            -H "svix-signature: v1,bad" \
            -d '{}' "$BASE/api/webhooks/resend")
          if [ "$webhook_bad_signature_code" != "401" ]; then
            echo "Bad-signature Resend webhook validation failed: expected HTTP 401, got $webhook_bad_signature_code"
            cat /tmp/resend-webhook-bad-signature.json
            exit 1
          fi
          echo "PASS /api/webhooks/resend bad signature rejected (401)"
