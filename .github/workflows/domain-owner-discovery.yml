name: Domain Owner Discovery

on:
  push:
    branches: [main]
    paths:
      - ".domain-owner-discovery-trigger"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      WWW_DOMAIN: www.jhbcurtaincleaning.co.za
      APEX_DOMAIN: jhbcurtaincleaning.co.za
    steps:
      - name: Discover accessible scopes and domain ownership
        shell: bash
        run: |
          set -uo pipefail
          test -n "$VERCEL_TOKEN"
          echo "=== whoami ==="
          npx --yes vercel@latest whoami --token "$VERCEL_TOKEN" || true
          echo "=== teams ==="
          npx --yes vercel@latest teams ls --token "$VERCEL_TOKEN" || true
          echo "=== bookish-eureka domains ==="
          npx --yes vercel@latest domains ls --limit 100 --scope bookish-eureka --token "$VERCEL_TOKEN" || true
          echo "=== accsu1983-2909s-projects domains ==="
          npx --yes vercel@latest domains ls --limit 100 --scope accsu1983-2909s-projects --token "$VERCEL_TOKEN" || true
          echo "=== inspect www in accsu scope ==="
          npx --yes vercel@latest domains inspect "$WWW_DOMAIN" --scope accsu1983-2909s-projects --token "$VERCEL_TOKEN" || true
          echo "=== inspect apex in accsu scope ==="
          npx --yes vercel@latest domains inspect "$APEX_DOMAIN" --scope accsu1983-2909s-projects --token "$VERCEL_TOKEN" || true
          echo "=== inspect aliases in accsu scope ==="
          npx --yes vercel@latest alias ls --limit 100 --scope accsu1983-2909s-projects --token "$VERCEL_TOKEN" | grep -E 'jhbcurtaincleaning\.co\.za|my-project|curtain-cleaning' || true
