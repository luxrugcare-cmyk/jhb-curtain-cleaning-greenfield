name: Domain Owner Discovery

on:
  push:
    branches: [main]
    paths:
      - ".domain-owner-discovery-trigger"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      WWW_DOMAIN: www.jhbcurtaincleaning.co.za
      APEX_DOMAIN: jhbcurtaincleaning.co.za
    steps:
      - name: Inspect personal Vercel account domain ownership
        shell: bash
        run: |
          set -uo pipefail
          test -n "$VERCEL_TOKEN"
          echo "=== whoami ==="
          npx --yes vercel@latest whoami --token "$VERCEL_TOKEN" || true
          echo "=== personal domains ==="
          npx --yes vercel@latest domains ls --limit 100 --token "$VERCEL_TOKEN" || true
          echo "=== inspect www in personal account ==="
          npx --yes vercel@latest domains inspect "$WWW_DOMAIN" --token "$VERCEL_TOKEN" || true
          echo "=== inspect apex in personal account ==="
          npx --yes vercel@latest domains inspect "$APEX_DOMAIN" --token "$VERCEL_TOKEN" || true
          echo "=== relevant personal aliases ==="
          npx --yes vercel@latest alias ls --limit 100 --token "$VERCEL_TOKEN" | grep -E 'jhbcurtaincleaning\.co\.za|my-project|curtain-cleaning' || true
