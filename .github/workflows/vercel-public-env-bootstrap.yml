name: Vercel Public Env Bootstrap

on:
  push:
    branches:
      - main
    paths:
      - ".vercel-env-bootstrap-trigger"

permissions:
  contents: read

jobs:
  configure:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - name: Require Vercel token
        run: |
          test -n "$VERCEL_TOKEN"

      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Link Vercel project
        run: >-
          npx --yes vercel@latest link --yes
          --scope bookish-eureka
          --project jhb-curtain-cleaning-greenfield
          --token "$VERCEL_TOKEN"

      - name: Configure safe production environment values
        shell: bash
        run: |
          set -euo pipefail
          set_env() {
            local name="$1"
            local value="$2"
            npx --yes vercel@latest env rm "$name" production --yes --scope bookish-eureka --token "$VERCEL_TOKEN" >/dev/null 2>&1 || true
            printf '%s' "$value" | npx --yes vercel@latest env add "$name" production --scope bookish-eureka --token "$VERCEL_TOKEN"
          }

          set_env NEXT_PUBLIC_SITE_URL "https://jhb-curtain-cleaning-greenfield.vercel.app"
          set_env NEXT_PUBLIC_BUSINESS_PHONE "+27 75 011 9200"
          set_env RESEND_FROM_EMAIL "JHB Curtain Cleaning <website@notify.jhbcurtaincleaning.co.za>"
          set_env LEAD_NOTIFICATION_EMAIL "info@jhbcurtaincleaning.co.za"
          set_env NEXT_PUBLIC_SANITY_DATASET "production"
          set_env NEXT_PUBLIC_SANITY_API_VERSION "2026-08-13"
          set_env ENABLE_FAILURE_ARCHIVE "true"
          set_env RESEND_TEMPLATE_RESIDENTIAL_ACK "be172493-9ce0-4cd8-bdc4-48db2d2371e3"
          set_env RESEND_TEMPLATE_COMMERCIAL_ACK "5c62cd77-fbe9-4273-bf50-7f2a62df41de"
          set_env RESEND_TEMPLATE_INTERNAL_LEAD "bcb0088f-db89-4046-87df-e8e2ca1ffc4c"

      - name: Pull and verify variable names only
        run: |
          npx --yes vercel@latest pull --yes --environment=production --scope bookish-eureka --token "$VERCEL_TOKEN" >/dev/null
          for name in NEXT_PUBLIC_SITE_URL NEXT_PUBLIC_BUSINESS_PHONE RESEND_FROM_EMAIL LEAD_NOTIFICATION_EMAIL NEXT_PUBLIC_SANITY_DATASET NEXT_PUBLIC_SANITY_API_VERSION ENABLE_FAILURE_ARCHIVE RESEND_TEMPLATE_RESIDENTIAL_ACK RESEND_TEMPLATE_COMMERCIAL_ACK RESEND_TEMPLATE_INTERNAL_LEAD; do
            grep -Eq "^${name}=.+" .vercel/.env.production.local
            echo "PASS ${name} configured"
          done
