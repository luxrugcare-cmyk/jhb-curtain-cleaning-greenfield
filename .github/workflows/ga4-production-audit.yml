name: GA4 Production Network Audit

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/ga4-production-audit.yml'
      - 'scripts/ga4-cdp-audit.mjs'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Install Chrome
        uses: browser-actions/setup-chrome@v2
        with:
          chrome-version: stable

      - name: Start isolated headless Chrome with CDP
        shell: bash
        run: |
          set -euo pipefail
          PROFILE_DIR="${RUNNER_TEMP}/jhb-ga4-cdp-profile"
          mkdir -p "$PROFILE_DIR"
          google-chrome \
            --headless=new \
            --disable-gpu \
            --no-sandbox \
            --remote-debugging-address=127.0.0.1 \
            --remote-debugging-port=9222 \
            --user-data-dir="$PROFILE_DIR" \
            about:blank >"${RUNNER_TEMP}/chrome-ga4.log" 2>&1 &
          echo $! > "${RUNNER_TEMP}/chrome-ga4.pid"
          for i in {1..30}; do
            if curl --silent --fail http://127.0.0.1:9222/json/version >/dev/null; then
              echo "PASS Chrome CDP ready"
              exit 0
            fi
            sleep 1
          done
          cat "${RUNNER_TEMP}/chrome-ga4.log" || true
          echo "FAIL Chrome CDP did not start"
          exit 1

      - name: Verify live GA4 network dispatch
        env:
          CDP_BASE: http://127.0.0.1:9222
        run: node scripts/ga4-cdp-audit.mjs

      - name: Stop Chrome
        if: always()
        shell: bash
        run: |
          if [ -f "${RUNNER_TEMP}/chrome-ga4.pid" ]; then
            kill "$(cat "${RUNNER_TEMP}/chrome-ga4.pid")" 2>/dev/null || true
          fi
